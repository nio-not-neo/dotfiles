# Two-line layout. Line 1: path, worktree, branch, commit (if detached), in-progress state, line deltas,
# file status, then every other module ($all). Line 2: arrow, clock, a random Pokeball, prompt character.
# The ball is picked per prompt by ~/.config/zsh/85-pokeball.zsh, which exports exactly one
# STARSHIP_BALL_<NAME>; only the matching env_var module renders. Modules named explicitly here are
# excluded from $all, which is how line 2 stays on line 2.
format = """
[╭─](dimmed white) $username$hostname$directory\
${custom.git_worktree}$git_branch$git_commit$git_state$git_metrics$git_status\
$all\
$line_break\
[╰─](dimmed white) $jobs$battery$time$status\
${env_var.ball_poke}${env_var.ball_great}${env_var.ball_ultra}${env_var.ball_master}${env_var.ball_premier}${env_var.ball_luxury}${env_var.ball_dusk}${env_var.ball_heavy}${env_var.ball_level}${env_var.ball_lure}${env_var.ball_moon}${env_var.ball_friend}${env_var.ball_love}${env_var.ball_fast}${env_var.ball_timer}${env_var.ball_repeat}${env_var.ball_net}${env_var.ball_nest}${env_var.ball_dive}${env_var.ball_quick}${env_var.ball_safari}${env_var.ball_sport}${env_var.ball_cherish}${env_var.ball_park}${env_var.ball_heal}${env_var.ball_dream}\
$character"""

[battery]
full_symbol = "🔋"
charging_symbol = "🔌"
discharging_symbol = "⚡"

[[battery.display]]
threshold = 30
style = "bold red"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[✖](bold red) "

[cmd_duration]
min_time = 10_000  # Show command duration over 10,000 milliseconds (=10 sec)
format = " took [$duration]($style)"

[directory]
read_only = " 󰌾"
truncation_length = 5
format = "[$path]($style)[$lock_symbol]($lock_style)"

[git_branch]
format = " [$symbol$branch]($style) "
symbol = " "
style = "bold yellow"

[git_commit]
commit_hash_length = 8
tag_disabled = false      # also show the tag when HEAD sits on one
style = "bold white"

[git_metrics]
disabled = false          # +added / -deleted lines in the working tree
format = "([+$added]($added_style) )([-$deleted]($deleted_style) )"

# Linked-worktree marker, showing the repo the worktree belongs to (the directory module already shows the
# worktree folder). Starship has no worktree module. Shows only when this checkout is a
# `git worktree` (git dir differs from the common dir), so plain clones stay uncluttered.
[custom.git_worktree]
description = "Name of the current linked git worktree"
when = '[ "$(git rev-parse --git-dir 2>/dev/null)" != "$(git rev-parse --git-common-dir 2>/dev/null)" ]'
command = 'basename "$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)")"'
shell = ["bash", "--noprofile", "--norc"]
symbol = "🌳 "
format = " [$symbol$output]($style)"
style = "bold green"

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '

[git_status]
conflicted = "⚔️ "
ahead = "🏎️ 💨 ×${count} "
behind = "🐢 ×${count} "
diverged = "🔱 🏎️ 💨 ×${ahead_count} 🐢 ×${behind_count} "
untracked = "🛤️  ×${count} "
stashed = "📦 "
modified = "📝 ×${count} "
staged = "🗃️  ×${count} "
renamed = "📛 ×${count} "
deleted = "🗑️  ×${count} "
style = "bright-white"
format = "$all_status$ahead_behind"

[hostname]
ssh_symbol = " "
ssh_only = false
format = "<[$hostname]($style)>"
trim_at = "-"
style = "bold dimmed white"
disabled = true

[julia]
format = "[$symbol$version]($style) "
symbol = "ஃ "
style = "bold green"

[memory_usage]
symbol = "󰍛 "
format = "$symbol[${ram}( | ${swap})]($style) "
threshold = 70
style = "bold dimmed white"
disabled = false

[package]
symbol = "󰏗 "

[python]
format = "[$symbol$version]($style) "
style = "bold green"

[rust]
format = "[$symbol$version]($style) "
style = "bold green"

[time]
time_format = "%T"
format = "🕙 $time($style) "
style = "bright-white"
disabled = false

[typst]
format = "[$symbol($version)]($style)"
style = "bold #239dae"

[username]
style_user = "bold dimmed blue"
show_always = false

