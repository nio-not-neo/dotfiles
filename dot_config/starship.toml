# Git-first layout: path, then worktree, branch, commit (if detached), in-progress state,
# line deltas and file status. $all keeps every other module; anything named above isn't repeated.
format = """
$username$hostname$directory\
${custom.git_worktree}$git_branch$git_commit$git_state$git_metrics$git_status\
$all"""

[battery]
full_symbol = "🔋"
charging_symbol = "🔌"
discharging_symbol = "⚡"

[[battery.display]]
threshold = 30
style = "bold red"

[character]
error_symbol = "[✖](bold red) "

[cmd_duration]
min_time = 10_000  # Show command duration over 10,000 milliseconds (=10 sec)
format = " took [$duration]($style)"

[directory]
read_only = " 󰌾"
truncation_length = 5
format = "[$path]($style)[$lock_symbol]($lock_style)"

[git_branch]
format = " [$symbol$branch]($style) "
symbol = " "
style = "bold yellow"

[git_commit]
commit_hash_length = 8
tag_disabled = false      # also show the tag when HEAD sits on one
style = "bold white"

[git_metrics]
disabled = false          # +added / -deleted lines in the working tree
format = "([+$added]($added_style) )([-$deleted]($deleted_style) )"

# Linked-worktree name. Starship has no worktree module. Shows only when this checkout is a
# `git worktree` (git dir differs from the common dir), so plain clones stay uncluttered.
[custom.git_worktree]
description = "Name of the current linked git worktree"
when = '[ "$(git rev-parse --git-dir 2>/dev/null)" != "$(git rev-parse --git-common-dir 2>/dev/null)" ]'
command = 'basename "$(git rev-parse --show-toplevel)"'
shell = ["bash", "--noprofile", "--norc"]
symbol = "🌳 "
format = " [$symbol$output]($style)"
style = "bold green"

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '

[git_status]
conflicted = "⚔️ "
ahead = "🏎️ 💨 ×${count} "
behind = "🐢 ×${count} "
diverged = "🔱 🏎️ 💨 ×${ahead_count} 🐢 ×${behind_count} "
untracked = "🛤️  ×${count} "
stashed = "📦 "
modified = "📝 ×${count} "
staged = "🗃️  ×${count} "
renamed = "📛 ×${count} "
deleted = "🗑️  ×${count} "
style = "bright-white"
format = "$all_status$ahead_behind"

[hostname]
ssh_symbol = " "
ssh_only = false
format = "<[$hostname]($style)>"
trim_at = "-"
style = "bold dimmed white"
disabled = true

[julia]
format = "[$symbol$version]($style) "
symbol = "ஃ "
style = "bold green"

[memory_usage]
symbol = "󰍛 "
format = "$symbol[${ram}( | ${swap})]($style) "
threshold = 70
style = "bold dimmed white"
disabled = false

[package]
symbol = "󰏗 "

[python]
format = "[$symbol$version]($style) "
style = "bold green"

[rust]
format = "[$symbol$version]($style) "
style = "bold green"

[time]
time_format = "%T"
format = "🕙 $time($style) "
style = "bright-white"
disabled = false

[typst]
format = "[$symbol($version)]($style)"
style = "bold #239dae"

[username]
style_user = "bold dimmed blue"
show_always = false

